name: Release

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      track:
        description: Upload a new Internal release or promote Internal to Production
        required: true
        default: internal
        type: choice
        options:
          - internal
          - production

concurrency:
  # Never interrupt a Play deployment. GitHub keeps the running release and coalesces
  # multiple pending runs down to the newest one.
  group: deploy-play-store

jobs:
  release:
    name: Build and release with Fastlane
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.track == 'internal')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: internal

    permissions:
      contents: write

    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Check release and APK completion
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: bundle exec fastlane android release_status

      - name: Copy CI gradle.properties
        if: steps.version.outputs.should_release == 'true'
        run: mkdir -p ~/.gradle && cp .github/gradle-ci.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        if: steps.version.outputs.should_release == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Gradle
        if: steps.version.outputs.should_release == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLEENCRYPTIONKEY }}
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: "yes"

      - name: Validate release secrets
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          for name in \
            ANDROID_RELEASE_KEYSTORE_B64 \
            ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD \
            PLAY_SERVICE_ACCOUNT_JSON
          do
            if [[ -z "${!name}" ]]; then
              echo "$name is required for releases." >&2
              exit 1
            fi
          done

      - name: Prepare release keystore
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          keystore_path="$RUNNER_TEMP/release-signing.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore_path"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Run the release quality gate for manual releases
        if: steps.version.outputs.should_release == 'true' && github.event_name == 'workflow_dispatch'
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: bundle exec fastlane android quality

      - name: Build signed release artifacts
        if: steps.version.outputs.should_release == 'true'
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: bundle exec fastlane android build_release

      - name: Upload release artifacts
        if: steps.version.outputs.should_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-v${{ steps.version.outputs.version_name }}
          path: |
            app/build/outputs/apk/play/release/*.apk
            app/build/outputs/apk/oss/release/*.apk
            app/build/outputs/bundle/playRelease/*.aab
            app/build/outputs/mapping/playRelease/mapping.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish Play and GitHub releases
        if: steps.version.outputs.should_release == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT_SHA: ${{ steps.version.outputs.release_sha }}
        run: bundle exec fastlane android publish_release

      - name: Clean up release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release-signing.jks"

  promote:
    name: Promote Internal to Production
    if: github.event_name == 'workflow_dispatch' && inputs.track == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Promote release with Fastlane
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android promote to:production
